
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipGenius AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080b18;color:white;font-family:Arial,sans-serif;padding:22px 15px}
.container{max-width:850px;margin:30px auto}
header{text-align:center;margin-bottom:30px}
.logo{font-size:32px;font-weight:800;color:#a78bfa;margin-bottom:10px}
header p{color:#9ca3b8}
.panel{background:#11172b;border:1px solid #293453;border-radius:17px;padding:22px}
label{display:block;margin-bottom:12px;font-weight:bold}
input{width:100%;padding:16px;background:#080d1e;border:1px solid #303b60;border-radius:9px;color:white;font-size:15px}
button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:9px;background:linear-gradient(90deg,#7c3aed,#4f46e5);color:white;font-weight:bold;font-size:16px}
button:disabled{opacity:.6}
.preview{display:none;margin-top:22px;background:#000;border-radius:12px;overflow:hidden}
.preview iframe{width:100%;aspect-ratio:16/9;display:block;border:0}
.preview-title{padding:13px;color:#c4b5fd}
.footer{text-align:center;margin-top:25px;color:#65708d;font-size:12px}
</style>
</head>

<body>
<main class="container">

<header>
<div class="logo">✂ ClipGenius AI</div>
<p>Discover the best moments in your videos.</p>
</header>

<section class="panel">
<label for="videoUrl">Paste your YouTube video link</label>

<input id="videoUrl" type="url"
placeholder="https://www.youtube.com/watch?v=...">

<button id="startButton">✂ Start Clipping</button>

<div class="preview" id="preview">
<div class="preview-title">Your Video</div>
<iframe id="videoFrame"
title="YouTube video player"
allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen
referrerpolicy="strict-origin-when-cross-origin">
</iframe>
</div>
</section>

<div class="footer">ClipGenius AI · Smart Video Workspace</div>
</main>

<script>
const SUPABASE_URL =
"https://fvigtwkbkxkfdkpvbvjx.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2aWd0d2tia3hrZmRrcHZidmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjI1MzEsImV4cCI6MjExMDY5ODUzMX0.p2CgJ6p8g0pCjTRqeBDyxQAEiJG3-zavKAPN1YCz5MI";

let db = null;

try {
  if (window.supabase) {
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  }
} catch (error) {
  console.error("Supabase initialization failed:", error);
}

const input = document.getElementById("videoUrl");
const button = document.getElementById("startButton");
const preview = document.getElementById("preview");
const frame = document.getElementById("videoFrame");

function getYouTubeId(value) {
  try {
    const url = new URL(value);
    const host = url.hostname.toLowerCase().replace(/^www\./, "");

    let id = null;

    if (host === "youtu.be") {
      id = url.pathname.split("/")[1];
    } else if (
      host === "youtube.com" ||
      host === "m.youtube.com" ||
      host === "youtube-nocookie.com"
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v");
      } else {
        const match = url.pathname.match(
          /^\/(embed|shorts|live)\/([^/?]+)/
        );
        if (match) id = match[2];
      }
    }

    return id && /^[a-zA-Z0-9_-]{11}$/.test(id)
      ? id
      : null;

  } catch {
    return null;
  }
}

function displayVideo(id) {
  frame.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(id);

  preview.style.display = "block";
}

function hideVideo() {
  frame.src = "";
  preview.style.display = "none";
}

async function saveJob(url) {
  if (!db) throw new Error("Supabase unavailable");

  let { data: { session }, error } =
    await db.auth.getSession();

  if (error) throw error;

  if (!session) {
    const result = await db.auth.signInAnonymously();
    if (result.error) throw result.error;
    session = result.data.session;
  }

  const { data: job, error: insertError } =
    await db.from("clip_jobs").insert({
      source_url: url,
      platform: "youtube",
      status: "queued",
      user_id: session.user.id
    }).select("id").single();

  if (insertError) throw insertError;

  const { error: functionError } =
    await db.functions.invoke("process-clip", {
      body: { job_id: job.id }
    });

  if (functionError) throw functionError;
}

button.addEventListener("click", async () => {
  const url = input.value.trim();
  const id = getYouTubeId(url);

  if (!id) {
    hideVideo();
    alert("Please paste a valid YouTube video link.");
    return;
  }

  // Display video independently of backend.
  displayVideo(id);

  // Backend runs silently.
  button.disabled = true;
  button.textContent = "Opening video...";

  saveJob(url).catch(error => {
    console.error("Background job error:", error);
  }).finally(() => {
    button.disabled = false;
    button.textContent = "✂ Start Clipping";
  });
});
</script>
</body>
</html>
