
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipGenius AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b18;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 35px auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #a78bfa;
      margin-bottom: 10px;
    }

    header p {
      color: #a5abc0;
      font-size: 14px;
    }

    .panel {
      background: #11172b;
      border: 1px solid #252e4b;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 45px #0005;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #303b60;
      border-radius: 10px;
      outline: none;
      background: #080d1e;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .preview {
      display: none;
      margin-top: 25px;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
      border: 1px solid #303b60;
    }

    .preview iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .preview-title {
      padding: 13px;
      color: #c4b5fd;
      font-size: 14px;
    }

    .message {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #69718c;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .container {
        margin-top: 15px;
      }

      .panel {
        padding: 18px;
      }

      .logo {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">✂ ClipGenius AI</div>
      <p>Turn your videos into engaging clips.</p>
    </header>

    <section class="panel">

      <label for="videoUrl">Paste your video link</label>

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste a YouTube video link here..."
        autocomplete="url"
      >

      <button id="clipButton">✂ Start Clipping</button>

      <div class="preview" id="preview">
        <div class="preview-title">Your Video</div>
        <iframe
          id="videoFrame"
          title="Video preview"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>

      <div class="message" id="message"></div>

    </section>

    <div class="footer">
      ClipGenius AI · Smart Video Clipping
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://fvigtwkbkxkfdkpvbvjx.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2aWd0d2tia3hrZmRrcHZidmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjI1MzEsImV4cCI6MjExMDY5ODUzMX0.p2CgJ6p8g0pCjTRqeBDyxQAEiJG3-zavKAPN1YCz5MI";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const videoInput = document.getElementById("videoUrl");
    const clipButton = document.getElementById("clipButton");
    const preview = document.getElementById("preview");
    const videoFrame = document.getElementById("videoFrame");

    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace(/^www\./, "");

        if (host === "youtu.be") {
          return parsed.pathname.split("/")[1] || null;
        }

        if (
          host === "youtube.com" ||
          host === "m.youtube.com" ||
          host === "youtube-nocookie.com"
        ) {
          if (parsed.pathname === "/watch") {
            return parsed.searchParams.get("v");
          }

          const match = parsed.pathname.match(
            /^\/(embed|shorts|live)\/([^/?]+)/
          );

          return match ? match[2] : null;
        }

        return null;
      } catch {
        return null;
      }
    }

    function showVideo(id) {
      videoFrame.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id);

      preview.style.display = "block";
    }

    function hideVideo() {
      videoFrame.src = "";
      preview.style.display = "none";
    }

    async function getUserSession() {
      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error) throw error;

      if (session) return session;

      const {
        data,
        error: signInError
      } = await supabase.auth.signInAnonymously();

      if (signInError) throw signInError;

      return data.session;
    }

    async function submitJob(url, platform) {
      const session = await getUserSession();

      if (!session || !session.user) {
        throw new Error("Could not create a user session.");
      }

      const {
        data: job,
        error: insertError
      } = await supabase
        .from("clip_jobs")
        .insert({
          source_url: url,
          platform: platform,
          status: "queued",
          user_id: session.user.id
        })
        .select("id")
        .single();

      if (insertError) throw insertError;

      // Run the backend silently.
      const { error: functionError } =
        await supabase.functions.invoke("process-clip", {
          body: {
            job_id: job.id
          }
        });

      if (functionError) {
        console.error("Background processing error:", functionError);
      }
    }

    clipButton.addEventListener("click", async () => {
      const url = videoInput.value.trim();

      if (!url) {
        hideVideo();
        return;
      }

      const videoId = getYouTubeId(url);

      if (!videoId) {
        hideVideo();
        return;
      }

      // Show the video immediately.
      showVideo(videoId);

      // Keep technical messages off the screen.
      clipButton.disabled = true;
      clipButton.textContent = "Opening video...";

      // Save and process in the background.
      submitJob(url, "youtube").catch(error => {
        console.error("Clip job error:", error);
      }).finally(() => {
        clipButton.disabled = false;
        clipButton.textContent = "✂ Start Clipping";
      });
    });

  </script>
</body>
</html>
