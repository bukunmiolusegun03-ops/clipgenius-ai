
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090817">
<title>ClipGenius AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #090817;
  color: white;
  padding: 25px 18px;
}

.container {
  max-width: 720px;
  margin: auto;
  text-align: center;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  margin: 25px 0 55px;
}

.logo span, h1 span {
  color: #a17aff;
}

.tag {
  display: inline-block;
  color: #bba6ff;
  background: #21183d;
  border: 1px solid #49317d;
  padding: 9px 16px;
  border-radius: 30px;
  font-size: 12px;
  margin-bottom: 22px;
}

h1 {
  font-size: clamp(35px, 7vw, 54px);
  line-height: 1.12;
  margin-bottom: 18px;
  letter-spacing: -2px;
}

.description {
  color: #aaa6bd;
  line-height: 1.7;
  max-width: 490px;
  margin: 0 auto 32px;
}

.input-box {
  background: #151326;
  border: 1px solid #34304f;
  border-radius: 17px;
  padding: 10px;
  display: flex;
  gap: 10px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 15px 12px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 14px;
}

input::placeholder {
  color: #77738e;
}

button {
  border: none;
  background: linear-gradient(135deg, #8755ff, #5732d5);
  color: white;
  padding: 15px 20px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.preview {
  display: none;
  margin-top: 25px;
  background: #151326;
  border: 1px solid #34304f;
  border-radius: 17px;
  padding: 12px;
  text-align: left;
}

.preview.show {
  display: block;
}

.preview h3 {
  font-size: 15px;
  margin: 5px 5px 12px;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #05040b;
  border-radius: 12px;
  overflow: hidden;
}

.player iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.preview-note {
  color: #aaa6bd;
  font-size: 12px;
  margin: 12px 5px 5px;
  line-height: 1.6;
}

.message {
  display: none;
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  text-align: left;
}

.success {
  display: block;
  background: #10291f;
  border: 1px solid #24754a;
  color: #9df0bd;
}

.error {
  display: block;
  background: #301719;
  border: 1px solid #8e3a42;
  color: #ffb0b5;
}

.platforms {
  color: #77738e;
  font-size: 12px;
  margin-top: 27px;
  line-height: 2;
}

.footer {
  color: #605b76;
  font-size: 11px;
  margin-top: 55px;
}

@media(max-width: 520px) {
  .input-box {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo">ClipGenius <span>AI</span></div>

  <div class="tag">✦ AI VIDEO CLIPPING PLATFORM</div>

  <h1>
    Turn Long Videos Into
    <span>Viral-Ready Clips.</span>
  </h1>

  <p class="description">
    Paste a video link to preview your video and
    submit it for AI clipping.
  </p>

  <div class="input-box">
    <input
      type="url"
      id="videoUrl"
      placeholder="Paste your YouTube video link..."
      autocomplete="url"
    >

    <button id="clipButton">
      ✂ Start Clipping
    </button>
  </div>

  <section class="preview" id="preview">
    <h3 id="videoTitle">Video Preview</h3>

    <div class="player" id="player"></div>

    <p class="preview-note" id="previewNote">
      YouTube video preview.
    </p>
  </section>

  <div id="message" class="message"></div>

  <div class="platforms">
    YouTube · TikTok · Instagram · Facebook · X
  </div>

  <div class="footer">
    © 2026 ClipGenius AI. Built for creators.
  </div>

</main>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://fvigtwkbkxkfdkpvbvjx.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2aWd0d2tia3hrZmRrcHZidmp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMjI1MzEsImV4cCI6MjExMDY5ODUzMX0.p2CgJ6p8g0pCjTRqeBDyxQAEiJG3-zavKAPN1YCz5MI";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const input = document.getElementById("videoUrl");
const button = document.getElementById("clipButton");
const message = document.getElementById("message");
const preview = document.getElementById("preview");
const player = document.getElementById("player");
const previewNote = document.getElementById("previewNote");
const videoTitle = document.getElementById("videoTitle");

function showMessage(text, type) {
  message.className = "message " + type;
  message.textContent = text;
}

function getYouTubeId(url) {
  try {
    const parsed = new URL(url);
    const host = parsed.hostname.toLowerCase();

    if (
      host === "youtu.be" ||
      host === "www.youtu.be"
    ) {
      return parsed.pathname.split("/")[1] || null;
    }

    if (
      host === "youtube.com" ||
      host === "www.youtube.com" ||
      host === "m.youtube.com" ||
      host === "youtube-nocookie.com" ||
      host === "www.youtube-nocookie.com"
    ) {
      if (parsed.pathname === "/watch") {
        return parsed.searchParams.get("v");
      }

      const match = parsed.pathname.match(
        /^\/(embed|shorts|live)\/([^/?]+)/
      );

      return match ? match[2] : null;
    }

    return null;

  } catch {
    return null;
  }
}

function showPreview(url) {
  const id = getYouTubeId(url);

  if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
    preview.classList.remove("show");
    player.replaceChildren();
    return;
  }

  const iframe = document.createElement("iframe");

  iframe.src =
    "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id);

  iframe.title = "YouTube video preview";
  iframe.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = "strict-origin-when-cross-origin";

  player.replaceChildren(iframe);

  videoTitle.textContent = "Your YouTube Video";
  previewNote.textContent =
    "Play your video here. Some videos may block embedding.";

  preview.classList.add("show");
}

input.addEventListener("input", () => {
  const url = input.value.trim();

  if (!url) {
    preview.classList.remove("show");
    player.replaceChildren();
    return;
  }

  showPreview(url);
});

function detectPlatform(url) {
  const host = new URL(url).hostname.toLowerCase();

  if (
    host === "youtube.com" ||
    host.endsWith(".youtube.com") ||
    host === "youtu.be"
  ) return "youtube";

  if (
    host === "tiktok.com" ||
    host.endsWith(".tiktok.com")
  ) return "tiktok";

  if (
    host === "instagram.com" ||
    host.endsWith(".instagram.com")
  ) return "instagram";

  if (
    host === "facebook.com" ||
    host.endsWith(".facebook.com") ||
    host === "fb.watch"
  ) return "facebook";

  if (
    host === "x.com" ||
    host.endsWith(".x.com") ||
    host === "twitter.com" ||
    host.endsWith(".twitter.com")
  ) return "x";

  return "other";
}

async function submitVideo() {
  const url = input.value.trim();

  if (!url) {
    showMessage("Please paste a video link first.", "error");
    return;
  }

  let parsed;

  try {
    parsed = new URL(url);

    if (
      !["https:", "http:"].includes(parsed.protocol)
    ) {
      throw new Error("Invalid URL");
    }
  } catch {
    showMessage("Please enter a valid video URL.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "Submitting...";
  message.className = "message";

  try {
    // GET USER SESSION

    let { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    let user = sessionData.session?.user;

    if (!user) {
      const { data, error } =
        await supabase.auth.signInAnonymously();

      if (error) throw error;

      user = data.user;
    }

    if (!user) {
      throw new Error("Could not create user session.");
    }

    // DETECT PLATFORM

    const platform = detectPlatform(url);

    // SAVE JOB

    const { data: job, error: insertError } =
      await supabase
        .from("clip_jobs")
        .insert({
          source_url: url,
          platform: platform,
          user_id: user.id,
          status: "queued"
        })
        .select("id, status")
        .single();

    if (insertError) throw insertError;

    // CALL BACKEND

    button.textContent = "Connecting...";

    const { data: result, error: functionError } =
      await supabase.functions.invoke("process-clip", {
        body: {
          job_id: job.id
        }
      });

    if (functionError) {
      console.error(functionError);

      showMessage(
        "Your video was saved, but the backend could not retrieve it. Job ID: " +
        job.id +
        ". Error: " + functionError.message,
        "error"
      );

      return;
    }

    if (!result || !result.success) {
      throw new Error(
        result?.error || "Unexpected backend response."
      );
    }

    showMessage(
      "Video submitted successfully! Your backend retrieved the job. Platform: " +
      platform +
      ". Job ID: " + job.id +
      ". AI clipping is not connected yet.",
      "success"
    );

  } catch (error) {
    console.error("ClipGenius:", error);

    showMessage(
      error.message || "Something went wrong.",
      "error"
    );

  } finally {
    button.disabled = false;
    button.textContent = "✂ Start Clipping";
  }
}

button.addEventListener("click", submitVideo);

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    submitVideo();
  }
});

</script>

</body>
</html>
